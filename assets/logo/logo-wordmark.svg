<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 96" width="332" height="96" role="img" aria-labelledby="st-wm-title">
  <title id="st-wm-title">Stok Takip</title>
  <defs>
    <linearGradient id="st-wm-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <g id="st-wm-crate">
      <rect width="44" height="44" rx="8" fill="#FFFFFF"/>
      <rect y="11" width="44" height="5" fill="#BFDBFE"/>
    </g>
  </defs>

  <!-- Simge (logo.svg ile aynı, 96 px yüksekliğe ölçeklenmiş) -->
  <g transform="scale(0.375)">
    <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#st-wm-tile)"/>
    <use href="#st-wm-crate" x="52" y="167"/>
    <use href="#st-wm-crate" x="106" y="167"/>
    <use href="#st-wm-crate" x="106" y="113"/>
    <use href="#st-wm-crate" x="160" y="167"/>
    <use href="#st-wm-crate" x="160" y="113"/>
    <use href="#st-wm-crate" x="160" y="47" transform="rotate(-10 182 69)"/>
  </g>

  <!-- Yazı: Segoe UI Semibold, tema metin rengi + birincil mavi -->
  <text x="114" y="63" font-family="'Segoe UI Semibold', 'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="44" letter-spacing="-0.4">
    <tspan fill="#0F172A">Stok</tspan><tspan fill="#2563EB" dx="11">Takip</tspan>
  </text>
</svg>
